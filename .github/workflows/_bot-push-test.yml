# One-off experiment: does a push made with the default GITHUB_TOKEN trigger
# the Cloudflare Workers Builds git integration (webhook → build)?
# We commit empty with the same identity the daily-update bot uses and push.
# Safe to delete after the experiment; the push itself changes no files.
name: Bot push test (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Empty commit and push as the bot would
        run: |
          git config user.name "yieldwatch-bot"
          git config user.email "bot@yieldwatch.io"
          git commit --allow-empty -m "ci: one-off GITHUB_TOKEN push test for Workers Builds trigger (safe to ignore)"
          git push
