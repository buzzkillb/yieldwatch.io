name: Daily data update

# Treasury publishes the daily yield-curve XML ~3:30pm ET. These UTC times
# straddle daylight saving so one attempt lands shortly after publication in
# both EDT and EST; the script exits early when there is no new data. A push
# triggers the Cloudflare Workers build automatically.
on:
  schedule:
    - cron: '45 19 * * 1-5' # 3:45pm EDT / 2:45pm EST
    - cron: '45 20 * * 1-5' # 4:45pm EDT / 3:45pm EST
    - cron: '45 21 * * 1-5' # 5:45pm EDT / 4:45pm EST
  workflow_dispatch:

permissions:
  contents: write

# Never let two scheduled attempts commit the same data file at once.
concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install API deps (prompt + retry helpers live in api/src)
        working-directory: api
        run: bun install --frozen-lockfile

      - name: Generate daily summaries
        id: generate
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: bun site/scripts/daily-update.ts

      - name: Validate generated data
        run: node site/scripts/validate-data.mjs

      - name: Commit and push
        run: |
          git config user.name "yieldwatch-bot"
          git config user.email "bot@yieldwatch.io"
          git add site/src/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Daily data update $(date -u +%F)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          echo "Could not push after 3 attempts" >&2
          exit 1

      - name: Fail if summary generation failed
        if: steps.generate.outcome == 'failure'
        run: |
          echo "Rates were committed; missing summaries will be backfilled on the next run." >&2
          exit 1
