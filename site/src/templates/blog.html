  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #0f0f18;
      --bg-card: #16161f;
      --bg-tertiary: #1a1a25;
      --border-color: #2a2a3a;
      --text-primary: #f0f0f5;
      --text-secondary: #a0a0b0;
      --text-muted: #606070;
      --accent: #6366f1;
      --accent-hover: #818cf8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    .header {
      background: linear-gradient(145deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
      border-bottom: 1px solid var(--border-color);
      padding: 1.5rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-content {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-primary);
    }

    .logo svg {
      width: 36px;
      height: 36px;
    }

    .logo-text {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .nav {
      display: flex;
      gap: 2rem;
    }

    .nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .nav a:hover, .nav a.active {
      color: var(--accent);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem;
    }

    .page-header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .filter-bar select {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      min-width: 120px;
    }

    .filter-bar select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .content-wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    .page-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .page-subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    .summaries-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .summary-card-link {
      text-decoration: none;
      display: block;
    }

    .summary-card-link:hover .summary-card {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.15);
    }

    .summary-date {
      font-size: 1.1rem;
      color: var(--text-primary);
      margin-bottom: 0.75rem;
    }

    .mini-chart {
      width: 100%;
      height: 80px;
      margin-bottom: 0.75rem;
    }

    .mini-chart canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .summary-excerpt {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .analysis-tag {
      color: var(--accent);
      font-size: 0.8rem;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .header {
        padding: 1rem;

      .nav {

      .container {

      .page-title {

      .filter-bar {

      .summary-card {

      margin-bottom: 0.5rem;

    .footer-links a {

      color: var(--text-muted);

      align-items: center;
      gap: 1.5rem;
    }

    .page-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 6px;
      transition: all 0.2s;
    }

    .page-link:hover {
      background: var(--accent);
      color: var(--bg-primary);
    }

    .page-info {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

        <a href="/">Dashboard</a>
        <a href="/blog" class="active">Daily Summaries</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="container" tabindex="-1">
    <div class="page-header">
      <h1 class="page-title">Daily Summaries</h1>
      <p class="page-subtitle">AI-powered Treasury yield curve analysis</p>
    </div>

    <div class="content-wrap">
      <div class="filter-bar">
        <select id="yearFilter" aria-label="Filter summaries by year">
          <option value="">All Years</option>
        </select>
        <select id="monthFilter" aria-label="Filter summaries by month" disabled>
          <option value="">All Months</option>
        </select>
      </div>
      <div id="content">
        <div class="loading">Loading summaries...</div>
      </div>
      <div id="pagination" class="pagination"></div>
    </div>
  </main>

  <script>
    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
                    'July', 'August', 'September', 'October', 'November', 'December'];

    function renderSummaries(summaries) {
      const summariesHtml = summaries.map((item) => {
        const date = new Date(item.date + 'T00:00:00');
        const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

        return `
          <a href="/blog/${item.date}/" class="summary-card-link">
            <article class="summary-card">
              <div class="summary-date">${dateStr}</div>
              ${item.title ? `<h2 class="summary-card-title">${item.title}</h2>` : ''}
              <div class="analysis-tag">${item.hasFullPost ? 'Full analysis available' : 'Quick summary'}</div>
              <p class="summary-excerpt">${item.excerpt}</p>
            </article>
          </a>
        `;
      }).join('');

      document.getElementById('content').innerHTML = `<div class="summaries-list">${summariesHtml}</div>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Static index: filters are wired in BlogList.astro.
  </script>

        <span class="divider">|</span>
        <a href="https://home.treasury.gov" target="_blank" rel="noopener noreferrer">U.S. Treasury</a>
      </div>
      <div class="footer-meta">Updated daily at 3:30 PM ET</div>
      <div class="footer-meta">Data: <span id="lastUpdated">Loading...</span></div>
    </div>
